# ==============================================================================
# DocHub GitHub Actions CI 合并门禁流水线
# 遵循 TECHNICAL_SPEC §18.6 与 ADR-001 / ADR-002 工程治理要求：
#   1. 后端代码规范（Ruff）、单元测试与集成测试（Pytest）、Alembic 单 Head 与迁移检查
#   2. 独立 ACL 与 RLS 安全回归门禁（验证 app_runtime 无 BYPASSRLS）
#   3. 前端 TypeScript 类型检查（TypeCheck）、生产构建（Build）与 Vitest 测试
#   4. 敏感信息与 Secret 泄漏扫描（禁止提交 .env 或明文 API Key）
#   5. Docker Compose 配置校验与 Backend / Frontend 镜像构建验证
# ==============================================================================

name: DocHub CI Gate

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

# 同一分支/PR 新提交自动取消旧流水线，节省 Runner 资源
concurrency:
  group: dochub-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限原则：仅授予仓库只读权限
permissions:
  contents: read

jobs:
  # ============================================================================
  # 任务 1：后端 Ruff 规范检查、Alembic 单 Head 校验与 Pytest 测试
  # ============================================================================
  backend-ci:
    name: Backend Lint, Alembic Single Head & Pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dochub
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dochub_pg_super_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dochub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping | grep -q PONG"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: dochub
      POSTGRES_SUPERUSER: postgres
      POSTGRES_SUPERUSER_PASSWORD: dochub_pg_super_dev
      POSTGRES_MIGRATOR_USER: app_migrator
      POSTGRES_MIGRATOR_PASSWORD: dochub_migrator_dev
      POSTGRES_RUNTIME_USER: app_runtime
      POSTGRES_RUNTIME_PASSWORD: dochub_runtime_dev
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      JWT_SECRET_KEY: ci_test_only_jwt_secret_key_at_least_32_chars_long
      CSRF_SECRET_KEY: ci_test_only_csrf_secret_key_at_least_32_chars

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 初始化 PostgreSQL 双角色（app_migrator / app_runtime）
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          PGPASSWORD="$POSTGRES_SUPERUSER_PASSWORD" psql \
            -h 127.0.0.1 -p 5432 -U "$POSTGRES_SUPERUSER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 \
            -f infra/postgres/init-roles.sql

      - name: 安装后端依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            pip install -e ".[dev]"
          else
            echo "::error::未找到 backend/requirements.txt 或 backend/pyproject.toml"
            exit 1
          fi

      - name: 运行 Ruff 代码风格与格式检查
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .

      - name: 检查 Alembic 单一 Migration Head 并执行迁移验证
        working-directory: backend
        run: |
          if [ ! -f alembic.ini ]; then
            echo "::error::未找到 backend/alembic.ini"
            exit 1
          fi
          HEAD_COUNT=$(alembic heads 2>/dev/null | grep -E '^[0-9a-fA-F]+' | wc -l | tr -d ' ')
          echo "当前检测到 Alembic Head 数量: ${HEAD_COUNT}"
          if [ "$HEAD_COUNT" -gt 1 ]; then
            echo "::error::检测到多个冲突的 Alembic Migration Head（${HEAD_COUNT} 个），必须合并为单一线性 Head！"
            alembic heads --verbose
            exit 1
          fi
          if [ "$HEAD_COUNT" -eq 1 ]; then
            echo "使用 app_migrator 执行 alembic upgrade head..."
            alembic upgrade head
          else
            echo "当前处于 Phase 0 骨架阶段，尚无 Alembic 迁移版本，单 Head 约束检查通过。"
          fi

      - name: 运行后端 Pytest 测试套件
        working-directory: backend
        run: |
          pytest -v --tb=short

  # ============================================================================
  # 任务 2：前端 TypeScript TypeCheck、生产构建与 Vitest 单元测试
  # ============================================================================
  frontend-ci:
    name: Frontend TypeCheck, Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装前端依赖
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: 运行 TypeScript 类型检查（tsc --noEmit）
        working-directory: frontend
        run: npm run typecheck

      - name: 运行前端安全约束静态校验（禁止 Access Token 写入 localStorage）
        working-directory: frontend
        run: |
          if grep -rnE "localStorage\.(setItem|getItem)\s*\([^)]*(access_token|accessToken|jwt|bearer)" src/; then
            echo "::error::检测到前端源码尝试将 Access Token/JWT 持久化到 localStorage，违反安全规范！"
            exit 1
          fi

      - name: 运行前端生产构建（Vite Build）
        working-directory: frontend
        run: npm run build

      - name: 运行前端测试（Vitest）
        working-directory: frontend
        run: npm test -- --run

  # ============================================================================
  # 任务 3：ACL 与 RLS 安全回归阻断门禁（TECHNICAL_SPEC §17.4 & §18.6）
  # ============================================================================
  acl-security-regression:
    name: ACL & RLS Security Regression Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dochub
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dochub_pg_super_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dochub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping | grep -q PONG"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: dochub
      POSTGRES_SUPERUSER: postgres
      POSTGRES_SUPERUSER_PASSWORD: dochub_pg_super_dev
      POSTGRES_MIGRATOR_USER: app_migrator
      POSTGRES_MIGRATOR_PASSWORD: dochub_migrator_dev
      POSTGRES_RUNTIME_USER: app_runtime
      POSTGRES_RUNTIME_PASSWORD: dochub_runtime_dev
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      JWT_SECRET_KEY: ci_security_gate_jwt_secret_key_32_chars_min
      CSRF_SECRET_KEY: ci_security_gate_csrf_secret_key_32_chars_min

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 初始化数据库角色并强制断言 app_runtime 无 SUPERUSER/BYPASSRLS 权限
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          PGPASSWORD="$POSTGRES_SUPERUSER_PASSWORD" psql \
            -h 127.0.0.1 -p 5432 -U "$POSTGRES_SUPERUSER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 \
            -f infra/postgres/init-roles.sql

          # 强断言：app_runtime 绝对禁止拥有 rolsuper 或 rolbypassrls
          BAD_ROLE_FLAGS=$(PGPASSWORD="$POSTGRES_SUPERUSER_PASSWORD" psql \
            -h 127.0.0.1 -p 5432 -U "$POSTGRES_SUPERUSER" -d "$POSTGRES_DB" \
            -tAc "SELECT count(*) FROM pg_roles WHERE rolname = 'app_runtime' AND (rolsuper OR rolbypassrls);")
          if [ "$BAD_ROLE_FLAGS" != "0" ]; then
            echo "::error::安全基线破坏：app_runtime 角色存在 SUPERUSER 或 BYPASSRLS 权限！"
            exit 1
          fi
          echo "PostgreSQL 角色安全断言通过：app_runtime 为最小权限非 BYPASSRLS 角色。"

      - name: 安装后端依赖并执行迁移
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          HEAD_COUNT=$(alembic heads 2>/dev/null | grep -E '^[0-9a-fA-F]+' | wc -l | tr -d ' ')
          if [ "$HEAD_COUNT" -eq 1 ]; then
            alembic upgrade head
          fi

      - name: 执行 ACL / RLS 安全回归测试
        working-directory: backend
        run: |
          # 优先运行专门的 security/acl 测试目录或 marker；Phase 0 阶段同步执行核心安全单元测试
          if [ -d tests/security ]; then
            pytest tests/security -v --tb=short
          elif pytest --collect-only -q -m "security or acl" >/dev/null 2>&1; then
            pytest -m "security or acl" -v --tb=short
          else
            echo "未发现独立 security/acl 标记套件，执行全量核心安全基线测试..."
            pytest tests -k "security or rls or acl or phase0" -v --tb=short
          fi

  # ============================================================================
  # 任务 4：Secret 与敏感凭证泄漏扫描（严禁任何密钥进入 Git）
  # ============================================================================
  secret-scan:
    name: Secret & Credential Leak Scan
    runs-on: ubuntu-latest
    steps:
      - name: 检出完整 Git 历史用于凭证扫描
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 禁止跟踪敏感文件（.env / *.pem / *.key）
        run: |
          FORBIDDEN=$(git ls-files | grep -E '(^|/)\.env($|\.)|\.(pem|key)$' | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "::error::仓库中检测到被 Git 跟踪的敏感文件，禁止合并："
            echo "$FORBIDDEN"
            exit 1
          fi
          echo "Git 跟踪文件检查通过，未发现 .env 或私钥文件。"

      - name: 运行 Gitleaks 密钥泄漏扫描
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # 任务 5：Docker Compose 语法校验与多阶段镜像构建验证
  # ============================================================================
  docker-build-verify:
    name: Docker Compose & Image Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 校验 Docker Compose 全量 Profile 配置（core / app / observability / full-demo）
        run: |
          docker compose --profile core config > /dev/null
          docker compose --profile app config > /dev/null
          docker compose --profile observability config > /dev/null
          docker compose --profile full-demo config > /dev/null
          echo "所有 Docker Compose Profile 语法校验通过。"

      - name: 校验可观测性配置文件格式
        run: |
          python3 -c "
          import json, pathlib
          dash = pathlib.Path('infra/observability/grafana/dashboards/dochub-overview.json')
          json.loads(dash.read_text(encoding='utf-8'))
          print('Grafana dashboard JSON 校验通过')
          "

      - name: 初始化 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建验证 Backend Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: false
          tags: dochub-api:ci-verify
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: 构建验证 Frontend Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: false
          tags: dochub-frontend:ci-verify
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
