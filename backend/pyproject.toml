# ==============================================================================
# DocHub 后端项目元数据与工具链配置（FastAPI + SQLAlchemy 2.x Async + Alembic）
# ==============================================================================

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dochub-backend"
version = "0.1.0"
description = "DocHub 企业级多租户知识库与受控 RAG 平台后端服务"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "alembic>=1.14.0,<2.0.0",
    "redis>=5.2.0,<6.0.0",
    "celery>=5.4.0,<6.0.0",
    "minio>=7.2.10,<8.0.0",
    "qdrant-client>=1.12.0,<2.0.0",
    "httpx>=0.27.2,<1.0.0",
    "python-multipart>=0.0.17,<1.0.0",
    "PyJWT>=2.9.0,<3.0.0",
    "argon2-cffi>=23.1.0,<26.0.0",
    "email-validator>=2.2.0,<3.0.0",
    "opentelemetry-api>=1.28.0,<2.0.0",
    "opentelemetry-sdk>=1.28.0,<2.0.0",
    "opentelemetry-exporter-otlp>=1.28.0,<2.0.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0,<1.0.0",
    "prometheus-fastapi-instrumentator>=7.0.0,<8.0.0",
    "pypdf>=5.1.0,<6.0.0",
    "python-docx>=1.1.2,<2.0.0",
    "openpyxl>=3.1.5,<4.0.0",
    # Windows Python 3.12 兼容性说明：
    # 独立包 hdbscan 在 Windows 环境下常因缺少 C++ Build Tools 导致源码编译失败。
    # DocHub 统一使用 scikit-learn (>=1.3) 内置的 sklearn.cluster.HDBSCAN（官方预编译 wheel），
    # 既完整满足 FAQ 问题聚类需求，又彻底避免 Windows 本地编译阻塞。
    "scikit-learn>=1.5.2,<2.0.0",
    "jieba>=0.42.1,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "ruff>=0.7.4,<1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
