# ==============================================================================
# DocHub 前端 Nginx 配置
# - 支持 React Router SPA 历史路由回退
# - 支持 /api/ 反向代理至后端 FastAPI（api:8000）
# - 针对 SSE 流式问答显式关闭 proxy_buffering 并延长超时
# ==============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 允许上传较大文档（具体上限仍由后端策略与 MinIO 预签名上传控制）
    client_max_body_size 100m;

    # 基础安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 前端容器自身健康探针（不依赖后端）
    location = /healthz-ui {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 后端 API 反向代理（包含流式 SSE 端点 /api/v1/chat/conversations/{id}/messages:stream）
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;

        # 透传客户端与主机上下文头（严禁在日志中记录 Authorization / Cookie）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE 流式传输强制关闭缓冲与缓存，确保 Token 实时推送至浏览器
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering "no" always;
    }

    # 静态构建产物长缓存（带内容 Hash）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
