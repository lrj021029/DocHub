# ==============================================================================
# DocHub Grafana 数据源自动预置配置
# 挂载位置：/etc/grafana/provisioning/datasources/datasources.yml
# 自动关联 Prometheus（指标）、Loki（日志）与 Tempo（链路追踪）三合一观测联动。
# ==============================================================================

apiVersion: 1

datasources:
  # 1. Prometheus 时序指标数据源（设为默认数据源）
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s

  # 2. Loki 日志数据源（支持通过 trace_id 字段一键跳转至 Tempo 查看完整调用链）
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: '"trace_id"\s*:\s*"([0-9a-fA-F]+)"'
          name: TraceID
          url: "$${__value.raw}"

  # 3. Tempo 链路追踪数据源（支持从 Span 联动下钻 Loki 日志与服务图）
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        filterByTraceID: true
        filterBySpanID: false
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
