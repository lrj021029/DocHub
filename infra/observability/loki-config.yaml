# ==============================================================================
# DocHub Grafana Loki 3.x 单节点日志存储配置
# 用途：持久化应用结构化 JSON 日志与安全审计脱敏日志（数据落盘至 Named Volume loki_data）。
# 注意：严禁业务将 API Key、敏感 Chunk 原文或未授权文档标题写入日志。
# ==============================================================================

# 本地单租户部署关闭多租户认证头要求（端口仅绑定 127.0.0.1）
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# Loki 3.x 推荐 TSDB + v13 Schema（支持结构化元数据与 OTLP 原生日志写入）
schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # 允许 OTLP 携带 trace_id / organization_id 等结构化元数据
  allow_structured_metadata: true
  # 本地开发/演示日志保留 7 天，避免 Named Volume 无限膨胀
  retention_period: 168h
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem
